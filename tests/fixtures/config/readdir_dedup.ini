; Config that produces non-consecutive duplicate directories in readdir.
; mockA and mockC share the same parent /dmdevfs_mockdrv0/ (same major=0),
; but mockB sits between them (no major -> parent="/").
; This exercises the non-consecutive directory dedup logic.
;
; Expected listing of "/":  null, dmdevfs_mockdrv0, dmdevfs_mockdrv
[mockA]
driver_name=dmdevfs_mockdrv
driver_order=10
major=0

[mockB]
driver_name=dmdevfs_mockdrv
driver_order=20

[mockC]
driver_name=dmdevfs_mockdrv
driver_order=30
major=0
