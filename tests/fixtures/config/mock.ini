; Devices of the test driver (mockdrv/), mounted by test_dmdevfs.c at /dev.
;   /dev/dmdevfs_mockdrv0   monitored          -> reported as "monitor"
;   /dev/dmdevfs_mockdrv1   monitored, opt-out -> not reported
;   /dev/dmdevfs_mockdrv2   plain              -> not reported
;   /dev/dmdevfs_mockdrv3   display            -> reported as "display"
;   /dev/dmdevfs_mockdrv4   input device       -> reported as "input"
;   /dev/dmdevfs_mockdrv5   display, report=input -> not reported
; mock3 and mock4 are one panel (friends_group=panel): a display and its
; touch input (friend_role=touch).
; Each can hot-plug a block child /dev/dmdevfs_mockdrv<major>/0.
[mock0]
driver_name=dmdevfs_mockdrv
major=0
monitor=true

[mock1]
driver_name=dmdevfs_mockdrv
major=1
monitor=true
report=none

[mock2]
driver_name=dmdevfs_mockdrv
major=2

[mock3]
driver_name=dmdevfs_mockdrv
major=3
display=true
friends_group=panel

[mock4]
driver_name=dmdevfs_mockdrv
major=4
input=true
friends_group=panel
friend_role=touch

[mock5]
driver_name=dmdevfs_mockdrv
major=5
display=true
report=input
