; Devices of the test driver (mockdrv/), mounted by test_dmdevfs.c at /dev.
;   /dev/dmdevfs_mockdrv0   monitored          -> reported as "monitor"
;   /dev/dmdevfs_mockdrv1   monitored, opt-out -> not reported
;   /dev/dmdevfs_mockdrv2   plain              -> not reported
; Each can hot-plug a block child /dev/dmdevfs_mockdrv<major>/0.
[mock0]
driver_name=dmdevfs_mockdrv
major=0
monitor=true

[mock1]
driver_name=dmdevfs_mockdrv
major=1
monitor=true
report=none

[mock2]
driver_name=dmdevfs_mockdrv
major=2
