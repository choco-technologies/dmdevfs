; Test driver for test_order.c, mounted at /dev. The sections are listed out
; of order on purpose - dmdevfs has to configure them by ascending
; driver_order, keeping file order within one value:
;   mock3 (-5), mock2 (-1), mock4 (-1), mock1 (0, default), mock0 (1)
[mock0]
driver_name=dmdevfs_mockdrv
major=0
driver_order=1

[mock1]
driver_name=dmdevfs_mockdrv
major=1

[mock2]
driver_name=dmdevfs_mockdrv
major=2
driver_order=-1

[mock3]
driver_name=dmdevfs_mockdrv
major=3
driver_order=-5

[mock4]
driver_name=dmdevfs_mockdrv
major=4
driver_order=-1
