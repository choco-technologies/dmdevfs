; Monitored nodes of the test driver for test_dmdevmon.c, mounted at /dev.
;   /dev/dmdevfs_mockdrv0   event handler "dmdevmon_test_event", 30 ms settle
;   /dev/dmdevfs_mockdrv1   polling every 50 ms
;   /dev/dmdevfs_mockdrv2   neither - one refresh, then nothing to monitor
;   /dev/dmdevfs_mockdrv3   not monitored at all
[mock0]
driver_name=dmdevfs_mockdrv
major=0
monitor=true
event_handler=dmdevmon_test_event
settle_ms=30

[mock1]
driver_name=dmdevfs_mockdrv
major=1
monitor=true
poll_interval_ms=50

[mock2]
driver_name=dmdevfs_mockdrv
major=2
monitor=true

[mock3]
driver_name=dmdevfs_mockdrv
major=3
