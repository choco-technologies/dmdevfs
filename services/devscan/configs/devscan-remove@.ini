; devscan-remove@.ini - libsystemd unit template, started by the "remove" key of the [class=mount] rule in
; devscan.rules when a mount point is about to be unmounted (%v is the mount point). The unmount waits for it.
;
; One shot: asks dmdevfs to drop what came from <mount point>/cfg/drivers and ends.
description=Drop the drivers of %v
exec=devscan
args=remove /dev %v
type=oneshot
