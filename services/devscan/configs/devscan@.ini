; devscan@.ini - libsystemd unit template, instantiated once per mount point by the [class=mount] rule in
; devscan.rules: %i is the mount point's name (e.g. "mnt_SD"), %v the mount point ("/mnt/SD").
;
; The first argument after "add" is where the dmdevfs whose drivers it is about is mounted. The only one there is
; mounts at /dev; with another (or a second) one, give the unit its own path here.
;
; One shot: asks dmdevfs to configure <mount point>/cfg/drivers and ends.
description=Scan %v for drivers
exec=devscan
args=add /dev %v
type=oneshot
