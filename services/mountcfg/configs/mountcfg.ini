; mountcfg.ini - libsystemd unit: loads the configuration directory (cfg/) of
; every mount point - cfg/drivers into dmdevfs, cfg/services and cfg/rules into
; libsystemd - and unloads it again before the mount point goes away.
;
; A Library module: starting the unit enables it, it follows the mounts from
; then on (and loads the ones there are already).
description=Configuration directories of mount points
exec=mountcfg
type=library
