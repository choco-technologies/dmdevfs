; mountcfg@.ini - libsystemd unit template, instantiated once per mount point by the [class=mount] rule in
; mountcfg.rules: %i is the mount point's name (e.g. "mnt_SD"), %v the mount point ("/mnt/SD").
;
; One shot: loads <mount point>/cfg and ends.
description=Load the configuration of %v
exec=mountcfg
args=load %v
type=oneshot
