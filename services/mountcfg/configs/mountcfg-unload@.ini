; mountcfg-unload@.ini - libsystemd unit template, started by the "remove" key of the [class=mount] rule in
; mountcfg.rules when a mount point is about to be unmounted (%v is the mount point). The unmount waits for it.
;
; One shot: stops what came from <mount point>/cfg and ends.
description=Unload the configuration of %v
exec=mountcfg
args=unload %v
type=oneshot
