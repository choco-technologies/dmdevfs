; dmdevmon@.ini - libsystemd unit template, instantiated once per monitored
; node by the [class=monitor] rule in dmdevmon.rules.
;
; %i expands to the node's name (e.g. "dmsdio0"), %v to its absolute path
; (e.g. "/dev/dmsdio0").
;
; dmdevmon exits with 0 when there is nothing to monitor (no event handler
; and no poll interval, or not a monitored node) and only fails on resource
; shortage - hence restart=on-failure.
;
; stop_timeout_ms: a stop waits for the running MONITOR_REFRESH to finish
; (e.g. an SD card identification) - dmdevmon is killed only after this long.
description=Device monitor for %i
exec=dmdevmon
args=%v
restart=on-failure
stop_timeout_ms=5000
